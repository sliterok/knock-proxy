<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-content: center;
        gap: 20px;
        background-color: #111;
        font-family: system-ui, sans-serif;
        text-align: center;
      }

      button {
        padding: 12px 36px;
        font-size: 1.5rem;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        background-color: #eee;
        color: #111;
      }

      button:active {
        background-color: #ccc;
      }

      iframe {
        border: none;
        width: 100%;
        height: 50px;
      }
    </style>
  </head>
  <body>
    <form action="/unlock" method="POST" target="result_display">
      <button type="submit">Knock</button>
    </form>

    <iframe name="result_display"></iframe>
  </body>
</html>
