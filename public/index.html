<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knock Proxy Unlock</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0f1a;
        --panel: #101827;
        --text: #e8eefc;
        --muted: #9ab0d0;
        --border: rgba(154, 176, 208, 0.18);
        --accent: #7aa2ff;
        --bad: #ff7a7a;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f9ff;
          --panel: #ffffff;
          --text: #0f172a;
          --muted: #475569;
          --border: rgba(15, 23, 42, 0.14);
          --accent: #2f6bff;
          --bad: #b42318;
        }
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(1000px 600px at 20% 0%, rgba(122, 162, 255, 0.22), transparent 60%),
          radial-gradient(900px 600px at 80% 20%, rgba(122, 255, 196, 0.14), transparent 55%),
          var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 780px;
        margin: 48px auto;
        padding: 0 16px;
      }
      header h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: 0.2px;
      }
      header p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.45;
      }
      .panel {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent), var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        backdrop-filter: blur(10px);
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        outline: none;
      }
      input:focus {
        border-color: rgba(122, 162, 255, 0.7);
        box-shadow: 0 0 0 3px rgba(122, 162, 255, 0.18);
      }
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr;
      }
      @media (min-width: 720px) {
        .grid {
          grid-template-columns: 1.3fr 0.7fr;
        }
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 12px;
      }
      button {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
      }
      button.primary {
        border-color: rgba(122, 162, 255, 0.55);
        background: linear-gradient(180deg, rgba(122, 162, 255, 0.35), rgba(122, 162, 255, 0.1));
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 10px;
      }
      pre {
        margin: 14px 0 0;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.25);
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .status-ok {
        color: var(--accent);
      }
      .status-bad {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Unlock Proxy</h1>
        <p>Whitelists your current IP for a limited time so you can connect to the public SOCKS port.</p>
      </header>

      <div class="panel">
        <form id="unlockForm">
          <div class="grid">
            <div>
              <label for="baseUrl">Server URL</label>
              <input id="baseUrl" type="url" inputmode="url" placeholder="https://example.com" required />
            </div>
            <div>
              <label for="ttlSec">TTL (seconds)</label>
              <input id="ttlSec" type="number" inputmode="numeric" min="10" max="604800" step="1" required />
            </div>
          </div>

          <div class="row" aria-label="TTL presets">
            <button type="button" data-ttl="600">10m</button>
            <button type="button" data-ttl="3600">1h</button>
            <button type="button" data-ttl="86400">1d</button>
            <button type="button" data-ttl="604800">7d</button>
            <button class="primary" id="unlockBtn" type="submit">Unlock</button>
          </div>

          <div class="hint">Calls <code>/unlock?ttl=...</code> and shows the response below.</div>
        </form>

        <pre id="output">Ready.</pre>
      </div>
    </div>

    <script>
      const baseUrlEl = document.getElementById("baseUrl");
      const ttlEl = document.getElementById("ttlSec");
      const formEl = document.getElementById("unlockForm");
      const outputEl = document.getElementById("output");
      const unlockBtnEl = document.getElementById("unlockBtn");

      baseUrlEl.value = location.origin;
      ttlEl.value = "3600";

      function setStatus(text, ok) {
        outputEl.classList.toggle("status-ok", ok === true);
        outputEl.classList.toggle("status-bad", ok === false);
        outputEl.textContent = text;
      }

      function sanitizeBaseUrl(raw) {
        const trimmed = String(raw || "").trim().replace(/\\/+$/, "");
        return trimmed;
      }

      document.querySelectorAll("button[data-ttl]").forEach((btn) => {
        btn.addEventListener("click", () => {
          ttlEl.value = String(btn.getAttribute("data-ttl"));
        });
      });

      formEl.addEventListener("submit", async (e) => {
        e.preventDefault();

        const baseUrl = sanitizeBaseUrl(baseUrlEl.value);
        const ttlSec = Number(ttlEl.value);
        if (!baseUrl) return setStatus("Missing server URL.", false);
        if (!Number.isFinite(ttlSec) || ttlSec < 10) return setStatus("TTL must be at least 10 seconds.", false);

        const url = `${baseUrl}/unlock?ttl=${encodeURIComponent(ttlSec)}`;

        unlockBtnEl.disabled = true;
        setStatus(`Requesting: ${url}`, null);
        try {
          const res = await fetch(url, { headers: { Accept: "application/json" } });
          const contentType = res.headers.get("content-type") || "";
          const bodyText = await res.text();

          if (!res.ok) {
            return setStatus(`${res.status} ${res.statusText}\\n\\n${bodyText}`, false);
          }

          if (contentType.includes("application/json")) {
            try {
              const json = JSON.parse(bodyText);
              return setStatus(`${res.status} ${res.statusText}\\n\\n${JSON.stringify(json, null, 2)}`, true);
            } catch {
              return setStatus(`${res.status} ${res.statusText}\\n\\n${bodyText}`, true);
            }
          }

          return setStatus(`${res.status} ${res.statusText}\\n\\n${bodyText}`, true);
        } catch (err) {
          return setStatus(String(err && err.message ? err.message : err), false);
        } finally {
          unlockBtnEl.disabled = false;
        }
      });
    </script>
  </body>
</html>
